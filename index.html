<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaxLabs — Crypto Tax Clarity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #020617, #020617 60%);
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 520px;
      width: 100%;
      padding: 48px;
      background: #0b1220;
      border-radius: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #cbd5f5;
      margin-bottom: 28px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      margin-bottom: 18px;
      padding: 10px;
      border-radius: 8px;
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #1e293b;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      color: #020617;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>TaxLabs</h1>
    <p>
      Upload your crypto transaction CSV and get a clean, human-readable tax
      summary — before tax season decides for you.
    </p>

    <!-- ✅ THIS IS THE IMPORTANT PART -->
    <form
      action="https://taxlabs-production.up.railway.app/upload"
      method="POST"
      enctype="multipart/form-data"
    >
      <input
        type="file"
        name="file"
        accept=".csv"
        required
      />

      <button type="submit">
        Upload CSV → Get Summary
      </button>
    </form>

    <footer>
      Built for clarity. No dashboards. No noise.
    </footer>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaxLabs — Crypto Tax Clarity</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #0b1220, #020617);
      border-radius: 18px;
      padding: 36px 32px 40px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    .subtitle {
      color: #cbd5f5;
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 16px;
      padding: 8px;
      color: #cbd5f5;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      color: #020617;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #94a3b8;
      min-height: 20px;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>TaxLabs</h1>

    <p class="subtitle">
      Upload your crypto wallet CSV.<br />
      Get a clean tax summary instantly.
    </p>

    <form
      id="uploadForm"
      action="https://taxlabs-production.up.railway.app/upload"
      method="POST"
      enctype="multipart/form-data"
    >
      <input
        type="file"
        name="file"
        accept=".csv"
        required
      />

      <button id="submitBtn" type="submit">
        Upload CSV → Download PDF
      </button>
    </form>

    <div id="status"></div>

    <div class="footer">
      Your file is processed securely.<br />
      PDF downloads automatically.
    </div>
  </div>

  <script>
    const form = document.getElementById("uploadForm");
    const button = document.getElementById("submitBtn");
    const status = document.getElementById("status");

    form.addEventListener("submit", () => {
      button.disabled = true;
      status.textContent = "Uploading and generating PDF…";
    });
  </script>
</body>
</html>

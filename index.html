<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaxLabs — Crypto Tax Clarity</title>
  <a name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #0b1220, #020617);
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #0b1220;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      color: #38bdf8;
    }

    p {
      margin: 0 0 24px 0;
      font-size: 14px;
      color: #9ca3af;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #1f2937;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: #0ea5e9;
      color: #020617;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #9ca3af;
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>TaxLabs</h1>
    <p>Upload your crypto wallet CSV.<br />Get a clean tax summary instantly.</p>

    <form id="uploadForm">
      <input
        type="file"
        id="fileInput"
        name="file"
        accept=".csv"
        required
      />

      <button type="submit" id="submitBtn">
        Upload CSV → Download PDF
      </button>

      <div id="status">Uploading…</div>
    </form>
  </div>

  <script>
    const form = document.getElementById("uploadForm");
    const button = document.getElementById("submitBtn");
    const status = document.getElementById("status");
    const fileInput = document.getElementById("fileInput");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!fileInput.files.length) {
        alert("Please select a CSV file.");
        return;
      }

      button.disabled = true;
      button.textContent = "Processing…";
      status.style.display = "block";
      status.textContent = "Uploading CSV and generating report…";

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const response = await fetch(
          "https://taxlabs-production.up.railway.app/upload",
          {
            method: "POST",
            body: formData,
          }
        );

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || "Upload failed");
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "TaxLabs_Report.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();

        window.URL.revokeObjectURL(url);

        status.textContent = "Download started ✔";
        button.textContent = "Done";
      } catch (err) {
        console.error(err);
        status.textContent = "Something went wrong. Please try again.";
        button.disabled = false;
        button.textContent = "Upload CSV → Download PDF";
      }
    });
  </script>
</body>
</html>

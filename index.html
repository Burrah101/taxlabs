<form
  id="uploadForm"
  action="https://taxlabs-production.up.railway.app/upload"
  method="POST"
  enctype="multipart/form-data"
>

  <!-- CSV FILE -->
  <input
    id="fileInput"
    type="file"
    name="file"
    accept=".csv"
    required
    style="margin-bottom: 14px; width: 100%;"
  />

  <!-- EMAIL -->
  <input
    type="email"
    name="email"
    placeholder="Enter your email (optional)"
    style="margin-bottom: 14px; width: 100%; padding: 10px;"
  />

  <!-- SUBMIT BUTTON -->
  <button
    id="submitBtn"
    type="submit"
    style="width: 100%; padding: 14px; font-weight: bold;"
  >
    Upload CSV → Download PDF
  </button>

  <!-- STATUS TEXT -->
  <div
    id="status"
    style="margin-top: 12px; font-size: 0.9rem; opacity: 0.8;"
  ></div>
</form>

<script>
  const form = document.getElementById("uploadForm");
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  form.addEventListener("submit", () => {
    btn.disabled = true;
    btn.textContent = "Uploading & generating…";
    status.textContent = "Processing securely. PDF will download automatically.";
  });

  // Reset button if user comes back after download
  window.addEventListener("pageshow", () => {
    btn.disabled = false;
    btn.textContent = "Upload CSV → Download PDF";
    status.textContent = "";
  });
</script>

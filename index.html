<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TaxLabs — Crypto Tax Clarity</title>

<style>
body {
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: #e5e7eb;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  padding: 0;
}

.container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: linear-gradient(180deg, #0b1220, #020617);
  border-radius: 18px;
  padding: 42px;
  width: 420px;
  text-align: center;
  box-shadow: 0 30px 90px rgba(0,0,0,0.7);
}

h1 {
  color: #38bdf8;
  margin-bottom: 10px;
}

p {
  font-size: 0.9rem;
  color: #cbd5f5;
  margin-bottom: 22px;
}

input[type="file"] {
  margin-bottom: 18px;
  color: #cbd5f5;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: linear-gradient(90deg, #38bdf8, #0ea5e9);
  color: #020617;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#status {
  margin-top: 14px;
  font-size: 0.85rem;
  color: #94a3b8;
}

.footer {
  margin-top: 26px;
  font-size: 0.75rem;
  color: #64748b;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>TaxLabs</h1>
    <p>
      Upload your crypto wallet CSV.<br />
      Get a clean tax summary instantly.
    </p>

    <form
      action="https://taxlabs-production.up.railway.app/upload"
      method="POST"
      enctype="multipart/form-data"
      onsubmit="startUpload()"
    >
      <input
        type="file"
        name="file"
        accept=".csv"
        required
      />

      <button id="submitBtn" type="submit">
        Upload CSV → Download PDF
      </button>
    </form>

    <div id="status"></div>

    <div class="footer">
      Your file is processed securely.<br />
      PDF downloads automatically.
    </div>
  </div>
</div>

<script>
function startUpload() {
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  btn.disabled = true;
  btn.innerText = "Uploading…";
  status.innerText = "Uploading and generating PDF…";

  // DO NOT prevent default
  // Browser must submit form normally
}
</script>

</body>
</html>

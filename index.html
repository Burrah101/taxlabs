<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaxLabs — Crypto Tax Clarity</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: linear-gradient(180deg, #0b1220, #020617);
      padding: 40px 44px;
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: #38bdf8;
      font-size: 2rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cbd5f5;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 16px;
      padding: 10px;
      background: #020617;
      color: #e5e7eb;
      border-radius: 10px;
      border: 1px solid #1e293b;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      color: #020617;
    }

    button:hover {
      opacity: 0.95;
    }

    .helper {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.7rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>TaxLabs</h1>

    <p class="subtitle">
      Upload your crypto wallet CSV.<br />
      Get a clean tax summary instantly.
    </p>

    <!-- ✅ REAL PRODUCTION FORM -->
    <form
      action="https://taxlabs-production.up.railway.app/upload"
      method="POST"
      enctype="multipart/form-data"
    >
      <input
        type="file"
        name="file"
        accept=".csv"
        required
      />

      <button type="submit">
        Upload CSV → Download PDF
      </button>
    </form>

    <p class="helper">
      Your file is processed securely.<br />
      The PDF downloads automatically.
    </p>

    <div class="footer">
      Clarity before compliance.
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TaxLabs — Crypto Tax Clarity</title>

<style>
body {
  background: radial-gradient(circle at top, #0f172a, #020617);
  font-family: system-ui;
  color: #e5e7eb;
  margin: 0;
  padding: 80px 0;
}

.card {
  max-width: 520px;
  margin: auto;
  background: #020617;
  border-radius: 16px;
  padding: 40px;
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
  text-align: center;
}

h1 {
  color: #38bdf8;
  margin-bottom: 10px;
}

p {
  color: #cbd5f5;
  font-size: 0.9rem;
  margin-bottom: 24px;
}

input, button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  margin-bottom: 14px;
  font-size: 0.95rem;
}

input {
  background: #020617;
  color: white;
  border: 1px solid #1e293b;
}

button {
  background: #38bdf8;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#status {
  margin-top: 14px;
  font-size: 0.85rem;
  color: #94a3b8;
}
</style>
</head>

<body>

<div class="card">
  <h1>TaxLabs</h1>
  <p>Upload your crypto wallet CSV. Get clarity before tax season.</p>

  <form
    action="https://taxlabs-production.up.railway.app/upload"
    method="POST"
    enctype="multipart/form-data"
    onsubmit="onSubmit()"
  >
    <input type="file" name="file" accept=".csv" required />
    <input type="email" name="email" placeholder="Email (optional — get PDF sent)" />
    <button id="submitBtn" type="submit">Upload CSV → Generate Report</button>
  </form>

  <div id="status"></div>
</div>

<script>
function onSubmit() {
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");
  btn.disabled = true;
  btn.innerText = "Uploading & generating...";
  status.innerText = "Processing securely. PDF will download automatically.";
}
</script>

</body>
</html>

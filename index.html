<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TaxLabs — Crypto Tax Checkup</title>

<style>
body {
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: #e5e7eb;
  font-family: system-ui, sans-serif;
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: linear-gradient(180deg, #0b1220, #020617);
  padding: 36px;
  border-radius: 18px;
  width: 420px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.6);
  text-align: center;
}

h1 {
  color: #38bdf8;
  margin-bottom: 8px;
}

p {
  color: #cbd5f5;
  font-size: 0.95rem;
  margin-bottom: 24px;
}

input[type="file"] {
  width: 100%;
  margin-bottom: 16px;
}

button {
  width: 100%;
  padding: 12px;
  background: #38bdf8;
  color: #020617;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#status {
  margin-top: 14px;
  font-size: 0.85rem;
  color: #94a3b8;
}
</style>

<script>
function onSubmit() {
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  btn.disabled = true;
  btn.innerText = "Uploading…";
  status.innerText = "Processing your CSV. PDF will download automatically.";
}
</script>
</head>

<body>
  <div class="card">
    <h1>TaxLabs</h1>
    <p>Upload your crypto wallet CSV.<br>Get a clean tax summary instantly.</p>

    <form
      action="https://taxlabs-production.up.railway.app/upload"
      method="POST"
      enctype="multipart/form-data"
      onsubmit="onSubmit()"
    >
      <input
        type="file"
        name="file"
        accept=".csv"
        required
      />

      <button id="submitBtn" type="submit">
        Upload CSV → Download PDF
      </button>
    </form>

    <div id="status"></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaxLabs — Crypto Tax Clarity</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0b1220;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: #020617;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 28px;
    }

    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.5;
    }

    input[type="file"] {
      margin-top: 24px;
      margin-bottom: 16px;
      width: 100%;
      color: #e5e7eb;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      color: #020617;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>TaxLabs</h1>

    <p>
      Upload your crypto transaction CSV<br />
      and get instant tax clarity.
    </p>

    <!-- ✅ THIS IS THE IMPORTANT PART -->
    <form
      action="https://taxlabs-production.up.railway.app/upload"
      method="POST"
      enctype="multipart/form-data"
      style="margin-top: 32px;"
    >
      <input
        type="file"
        name="file"
        accept=".csv"
        required
      />

      <button type="submit">
        Upload CSV → Get Report
      </button>
    </form>

    <div class="footer">
      Powered by TaxLabs
    </div>
  </div>
</body>
</html>

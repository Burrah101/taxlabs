<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaxLabs — Crypto Tax Checkup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Ubuntu, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #0b1220, #020617);
      border-radius: 18px;
      padding: 36px 32px 40px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      color: #38bdf8;
      text-align: center;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #cbd5f5;
      text-align: center;
      line-height: 1.5;
    }

    form {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input[type="file"],
    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      color: #e5e7eb;
      font-size: 0.9rem;
    }

    input::file-selector-button {
      margin-right: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #1e293b;
      color: #e5e7eb;
      cursor: pointer;
    }

    input::file-selector-button:hover {
      background: #334155;
    }

    button {
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      color: #020617;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      min-height: 1.2em;
    }

    .footer {
      margin-top: 26px;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>TaxLabs</h1>
    <div class="subtitle">
      Upload your crypto wallet CSV.<br />
      Get clarity before tax season.
    </div>

    <form
      action="https://taxlabs-production.up.railway.app/upload"
      method="POST"
      enctype="multipart/form-data"
      onsubmit="onSubmit()"
    >
      <input
        type="file"
        name="file"
        accept=".csv"
        required
      />

      <input
        type="email"
        name="email"
        placeholder="Your email (to receive the PDF)"
        required
      />

      <button id="submitBtn" type="submit">
        Upload CSV → Generate Report
      </button>
    </form>

    <div id="status" class="status"></div>

    <div class="footer">
      Processing is secure.<br />
      PDF downloads automatically after upload.
    </div>
  </div>

  <script>
    function onSubmit() {
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.innerText = "Uploading & generating…";
      status.innerText = "Processing securely. Please wait…";
    }
  </script>
</body>
</html>

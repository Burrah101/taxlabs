<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaxLabs — Crypto Tax Checkup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, #0b1220, #020617);
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.9rem;
      color: #38bdf8;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #cbd5f5;
      margin-bottom: 28px;
    }

    label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 6px;
      display: block;
    }

    input[type="file"],
    input[type="email"] {
      width: 100%;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px;
      color: #e5e7eb;
      margin-bottom: 18px;
    }

    input[type="file"]::file-selector-button {
      background: #1e293b;
      border: none;
      color: #e5e7eb;
      padding: 6px 10px;
      border-radius: 6px;
      margin-right: 10px;
      cursor: pointer;
    }

    button {
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      color: #020617;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 14px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>TaxLabs</h1>
    <div class="subtitle">
      Upload your crypto wallet CSV.<br/>
      Get clarity before tax season.
    </div>

    <!-- 🚨 DO NOT CHANGE THIS FORM CONTRACT -->
    <form
      action="https://taxlabs-production.up.railway.app/upload"
      method="POST"
      enctype="multipart/form-data"
      onsubmit="handleSubmit()"
    >
      <label>Wallet CSV</label>
      <input type="file" name="file" accept=".csv" required />

      <label>Email (optional)</label>
      <input type="email" name="email" placeholder="you@example.com" />

      <button id="submitBtn" type="submit">
        Upload CSV → Generate Report
      </button>

      <div id="status" class="status">
        Processing securely. PDF will download automatically.
      </div>
    </form>
  </div>

  <script>
    function handleSubmit() {
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.innerText = "Uploading & generating…";
      status.innerText = "Please wait — generating your tax report PDF…";
    }
  </script>

</body>
</html>
